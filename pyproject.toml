[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "joblister"
version = "0.1.0"
description = "Scrape job postings from career boards using ATS detection"
# 3.11, not 3.9: detector.py imports StrEnum, which landed in 3.11. The old
# floor had never been run against a 3.9 interpreter and could not have worked.
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.12.3",
    "pandas>=1.3.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
render = ["playwright>=1.40.0"]
cv = ["python-docx>=1.1.0"]
dev = ["pytest>=8.3.0", "flake8>=7.1.0"]

[project.scripts]
joblister = "main:main"

[tool.setuptools]
packages = ["job_scraper", "job_scraper.strategies", "db", "ai", "cv_generator"]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
