apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingest-jobs
spec:
  schedule: "0 1 * * *"
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 14400
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
          - name: ingest-jobs
            image: joblister-ingest:latest
            imagePullPolicy: IfNotPresent
            command: ["python", "-m", "job_scraper.scrape_postings", "--ingest", "--max-minutes", "225"]
            envFrom:
            - secretRef: {name: joblister-secrets}
            resources:
              requests: {cpu: 250m, memory: 512Mi}
              limits: {memory: 1Gi}
            volumeMounts:
            - {name: data, mountPath: /data}
          volumes:
          - name: data
            persistentVolumeClaim: {claimName: joblister-data}
