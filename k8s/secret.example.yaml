# Placeholders only. Do not put real values here or commit a filled copy.
# Create the real one from your shell instead:
#
#   kubectl create secret generic joblister-secrets \
#     --from-literal=DATABASE_URL='postgresql+psycopg://...' \
#     --from-literal=FRANCE_TRAVAIL_CLIENT_ID='...' \
#     --from-literal=FRANCE_TRAVAIL_CLIENT_SECRET='...'
#
# The France Travail pair is optional: without it (or without SEARCH_KEYWORDS)
# the source is skipped. The jobs read every key as an env var.
apiVersion: v1
kind: Secret
metadata:
  name: joblister-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://joblister:change-me@postgres:5432/joblister
  FRANCE_TRAVAIL_CLIENT_ID: change-me
  FRANCE_TRAVAIL_CLIENT_SECRET: change-me
