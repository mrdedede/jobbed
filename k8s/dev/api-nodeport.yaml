# Dev only: a NodePort next to the ClusterIP Service in k8s/api.yaml, which
# stays production-shaped.
#
#   kubectl apply -f k8s/dev/api-nodeport.yaml
#
# Linux or a VM driver: http://$(minikube ip):30080. macOS with the docker
# driver (minikube's node IP is inside Docker's VM and not routable from the
# host): use the tunnel instead, and leave it running:
#
#   minikube service jobbed-api-nodeport --url
apiVersion: v1
kind: Service
metadata:
  name: jobbed-api-nodeport
spec:
  type: NodePort
  selector: {app: jobbed-api}
  ports:
  - {port: 8080, targetPort: 8080, nodePort: 30080}
