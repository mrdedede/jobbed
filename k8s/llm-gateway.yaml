apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
spec:
  replicas: 1
  selector:
    matchLabels: {app: llm-gateway}
  template:
    metadata:
      labels: {app: llm-gateway}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: llm-gateway
        image: jobbed-llm-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: jobbed-gateway-secrets
              key: ANTHROPIC_API_KEY
              optional: true
        - {name: OLLAMA_BASE_URL, value: "http://ollama:11434"}
        readinessProbe:
          httpGet: {path: /healthz, port: 8000}
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /healthz, port: 8000}
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
spec:
  selector: {app: llm-gateway}
  ports:
  - port: 8000
