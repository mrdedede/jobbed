# flake8 cannot read pyproject.toml, so its configuration lives here.
#
# Without this file flake8 runs at its default 79 columns, which reports ~79
# findings across a codebase written to 100 -- and made "12 findings" an
# unreproducible number that depended on the flags you happened to pass.
[flake8]
max-line-length = 100
exclude = .git,__pycache__,build,dist,.pytest_cache
