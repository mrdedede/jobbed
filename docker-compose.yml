services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: joblister
      POSTGRES_PASSWORD: joblister
      POSTGRES_DB: joblister
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joblister -d joblister"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  llm_gateway:
    build:
      context: .
      dockerfile: llm_gateway/Dockerfile
    environment:
      # Empty is fine until a "haiku"/"sonnet"/"opus" request arrives; then
      # the gateway answers 502 instead of calling Claude.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  ollama_data:
