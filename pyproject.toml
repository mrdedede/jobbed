[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "joblister"
version = "0.1.0"
description = "Scrape job postings from career boards using ATS detection"
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4==4.12.2",
    "pandas>=1.3.0",
    "requests>=2.28.0",
    "playwright>=1.40.0; extra == 'render'",
]

[project.optional-dependencies]
render = ["playwright>=1.40.0"]
dev = ["pytest>=8.3.0", "flake8>=7.1.0"]

[tool.setuptools]
packages = ["job_scraper"]
