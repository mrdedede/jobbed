services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: joblister
      POSTGRES_PASSWORD: joblister
      POSTGRES_DB: joblister
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joblister -d joblister"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  ollama_data:
