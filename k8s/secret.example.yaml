# Placeholders only. Do not put real values here or commit a filled copy.
# Create the real one from your shell instead:
#
#   kubectl create secret generic jobbed-secrets \
#     --from-literal=DATABASE_URL='postgresql+psycopg://...' \
#     --from-literal=FRANCE_TRAVAIL_CLIENT_ID='...' \
#     --from-literal=FRANCE_TRAVAIL_CLIENT_SECRET='...'
#
# The France Travail pair is optional: without it (or without SEARCH_KEYWORDS)
# the source is skipped. The jobs read every key as an env var.
#
# The API and the gateway have their own Secrets, so each pod only ever sees
# what it needs (the Anthropic key never reaches a scraper, the France Travail
# credentials never reach the API):
#
#   kubectl create secret generic jobbed-api-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)"
#   kubectl create secret generic jobbed-gateway-secrets \
#     --from-literal=ANTHROPIC_API_KEY='...'
apiVersion: v1
kind: Secret
metadata:
  name: jobbed-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://jobbed:change-me@postgres:5432/jobbed
  FRANCE_TRAVAIL_CLIENT_ID: change-me
  FRANCE_TRAVAIL_CLIENT_SECRET: change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: jobbed-api-secrets
type: Opaque
stringData:
  # At least 32 characters; the API refuses to start otherwise.
  JWT_SECRET: change-me-to-at-least-32-random-characters
---
apiVersion: v1
kind: Secret
metadata:
  name: jobbed-gateway-secrets
type: Opaque
stringData:
  ANTHROPIC_API_KEY: change-me
