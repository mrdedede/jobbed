x-job-env: &job-env
  DATABASE_URL: postgresql+psycopg://joblister:joblister@postgres:5432/joblister
  JOBLISTER_DATA_DIR: /data
  # Optional; the France Travail source stays off without them.
  FRANCE_TRAVAIL_CLIENT_ID: ${FRANCE_TRAVAIL_CLIENT_ID:-}
  FRANCE_TRAVAIL_CLIENT_SECRET: ${FRANCE_TRAVAIL_CLIENT_SECRET:-}

x-scrape-build: &scrape-build
  context: .
  dockerfile: job_scraper/Dockerfile
  target: scrape

x-job: &job
  build:
    context: .
    dockerfile: job_scraper/Dockerfile
    target: ingest
  image: joblister-ingest
  environment: *job-env
  volumes:
    - jobs_data:/data
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: joblister
      POSTGRES_PASSWORD: joblister
      POSTGRES_DB: joblister
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joblister -d joblister"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  ollama:
    image: ollama/ollama:latest
    networks: [default, llm]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  llm_gateway:
    build:
      context: .
      dockerfile: llm_gateway/Dockerfile
    environment:
      # Empty is fine until a "haiku"/"sonnet"/"opus" request arrives; then
      # the gateway answers 502 instead of calling Claude.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: http://ollama:11434
    # The gateway holds the Anthropic key, so it accepts calls from the API
    # and nothing else: it is on the private `llm` network only (not the
    # default one the database and the jobs are on) and publishes no host
    # port. Debug through `docker compose exec api ...`.
    networks: [llm]
    # No depends_on ollama: Claude-only grading needs none, and the gateway
    # reaches Ollama lazily over HTTP. `docker compose up ollama` when wanted.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The user-facing REST API. Needs the schema first:
  #   docker compose --profile jobs run --rm migrate
  # then: JWT_SECRET=... docker compose up api
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: joblister-api
    environment:
      DATABASE_URL: postgresql+psycopg://joblister:joblister@postgres:5432/joblister
      GATEWAY_URL: http://llm_gateway:8000
      # Empty, not `:?`: interpolation is file-wide, so a required variable
      # would break every other compose command. The app fails fast instead.
      JWT_SECRET: ${JWT_SECRET:-}
      # Models a client may request. Add e.g. ollama-qwen2.5:0.5b to grade
      # locally (and `docker compose up ollama`).
      ANALYSIS_MODELS: ${ANALYSIS_MODELS:-haiku,sonnet}
    ports:
      - "8080:8080"
    networks: [default, llm]
    depends_on:
      postgres:
        condition: service_healthy
      llm_gateway:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # Nightly jobs. Not started by `docker compose up`; run
  # one stage at a time, in order, as the CronJobs will:
  #
  #   docker compose --profile jobs run --rm migrate
  #   docker compose --profile jobs run --rm scrape
  #   docker compose --profile jobs run --rm ingest
  #
  # They hand files to each other through the jobs_data volume (the PVC in
  # Kubernetes) and write to the same Postgres as the app.
  # ---------------------------------------------------------------------

  migrate:
    <<: *job
    profiles: ["jobs"]
    # One-off at deploy time: schema, then the boards list.
    command: ["sh", "-c", "alembic upgrade head && python -m db.boards"]
    environment:
      <<: *job-env
      JOBLISTER_BOARDS_CSV: /config/job_boards.csv
    volumes:
      - jobs_data:/data
      - ./user_info/job_boards.csv:/config/job_boards.csv:ro

  scrape:
    <<: *job
    profiles: ["jobs"]
    command: ["python", "-m", "job_scraper.scrape_boards"]

  render-boards:
    <<: *job
    profiles: ["jobs"]
    build: *scrape-build
    image: joblister-scrape
    command: ["python", "-m", "job_scraper.scrape_boards", "--render-missed"]
    # Chromium's /dev/shm is 64 MB by default.
    shm_size: "1gb"

  ingest:
    <<: *job
    profiles: ["jobs"]
    command: ["python", "-m", "job_scraper.scrape_postings", "--ingest",
              "--max-minutes", "225"]

  render-postings:
    <<: *job
    profiles: ["jobs"]
    build: *scrape-build
    image: joblister-scrape
    command: ["python", "-m", "job_scraper.scrape_postings", "--render-failed"]
    shm_size: "1gb"

networks:
  # Gateway <-> API (and Ollama, which the gateway calls). A normal bridge,
  # not `internal`: the gateway needs outbound access to Anthropic.
  llm: {}

volumes:
  postgres_data:
  ollama_data:
  jobs_data:
