apiVersion: batch/v1
kind: CronJob
metadata:
  name: scrape-boards
spec:
  schedule: "0 0 * * *"
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 2700
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
          - name: scrape-boards
            image: jobbed-ingest:latest
            imagePullPolicy: IfNotPresent
            command: ["python", "-m", "job_scraper.scrape_boards"]
            envFrom:
            - secretRef: {name: jobbed-secrets}
            resources:
              requests: {cpu: 250m, memory: 512Mi}
              limits: {memory: 1Gi}
            volumeMounts:
            - {name: data, mountPath: /data}
          volumes:
          - name: data
            persistentVolumeClaim: {claimName: jobbed-data}
